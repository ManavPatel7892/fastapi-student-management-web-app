<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Student Details · Aurora Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .profile-header { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap; margin-bottom:1.5rem; }
        .profile-avatar { width:96px; height:96px; border-radius:50%; background:var(--primary,#5b4bdb); color:#fff; display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:700; overflow:hidden; }
        .profile-avatar img { width:100%; height:100%; object-fit:cover; }
        .info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
        .info-item label { display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:#888; margin-bottom:.25rem; }
        .info-item div { font-weight:500; }
        .section-title { font-size:1rem; margin:1.5rem 0 .75rem; padding-bottom:.4rem; border-bottom:1px solid #eee; }
    </style>
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <div class="brand">AURORA <span>ADMIN</span></div>
        <div class="nav-label">Management</div>
        <a class="nav-link" href="index.html"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
        <a class="nav-link active" href="students.html"><i class="bi bi-people-fill"></i>Students</a>
        <a class="nav-link" href="add-student.html"><i class="bi bi-person-plus-fill"></i>Add Student</a>
        <div class="nav-label">Account</div>
        <a class="nav-link" href="../index.html"><i class="bi bi-box-arrow-up-right"></i>View Website</a>
        <a class="nav-link" href="../login.html" data-logout><i class="bi bi-box-arrow-right"></i>Logout</a>
        <div class="admin">
            <div class="avatar">AD</div>
            <div><b class="admin-name">Admin User</b>
                <div class="muted admin-role">System Manager</div>
            </div>
        </div>
    </aside>
    <main class="main">
        <header class="top">
            <div><button class="btn light mobile" id="menu"><i class="bi bi-list"></i></button> <b>Student Details</b>
                <div class="crumb">Aurora Student Suite / Students / Details</div>
            </div>
            <div class="avatar">AD</div>
        </header>
        <div class="content">
            <div class="toolbar">
                <div>
                    <h1 id="pageTitle">Student Profile</h1>
                    <div class="muted">Full record of the learner.</div>
                </div>
                <div style="display:flex;gap:.5rem">
                    <a href="students.html" class="btn light">Back</a>
                    <a id="editBtn" href="#" class="btn primary"><i class="bi bi-pencil"></i> Edit</a>
                    <button id="deleteBtn" class="btn light" style="color:#c0392b"><i class="bi bi-trash"></i> Delete</button>
                </div>
            </div>
            <div id="alertBox" class="alert d-none" style="margin-bottom:1rem"></div>
            <div class="card" id="profileCard">
                <div class="muted">Loading…</div>
            </div>
        </div>
    </main>

    <div id="deleteModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center">
        <div class="card" style="max-width:400px;margin:1rem;padding:1.5rem">
            <h3 style="margin-top:0">Delete student?</h3>
            <p class="muted">This action cannot be undone.</p>
            <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.25rem">
                <button class="btn light" id="cancelDelete">Cancel</button>
                <button class="btn primary" id="confirmDelete" style="background:#c0392b">Delete</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        if (!id) location.href = "students.html";

        document.getElementById("editBtn").href = "update-student.html?id=" + id;

        function val(v) { return v || "—"; }

        (async () => {
            try {
                const s = await getStudent(id);
                document.getElementById("pageTitle").textContent = s.first_name + " " + s.last_name;
                const imgSrc = s.profile_image
                    ? (s.profile_image.startsWith("http") ? s.profile_image : (API_BASE + s.profile_image))
                    : null;
                const avatarHtml = imgSrc
                    ? `<img src="${imgSrc}" alt="">`
                    : initials(s.first_name, s.last_name);

                document.getElementById("profileCard").innerHTML = `
                    <div class="profile-header">
                        <div class="profile-avatar">${avatarHtml}</div>
                        <div>
                            <h2 style="margin:0 0 .25rem">${s.first_name} ${s.last_name}</h2>
                            <div class="muted">${s.student_id} · ${val(s.course)}</div>
                            <div class="muted">${s.email}</div>
                        </div>
                    </div>

                    <div class="section-title">Personal information</div>
                    <div class="info-grid">
                        <div class="info-item"><label>Date of Birth</label><div>${formatDate(s.date_of_birth)}</div></div>
                        <div class="info-item"><label>Gender</label><div>${val(s.gender)}</div></div>
                    </div>

                    <div class="section-title">Contact information</div>
                    <div class="info-grid">
                        <div class="info-item"><label>Email</label><div>${val(s.email)}</div></div>
                        <div class="info-item"><label>Phone</label><div>${val(s.phone)}</div></div>
                        <div class="info-item"><label>Address</label><div>${val(s.address)}</div></div>
                        <div class="info-item"><label>City</label><div>${val(s.city)}</div></div>
                        <div class="info-item"><label>State</label><div>${val(s.state)}</div></div>
                        <div class="info-item"><label>Postal Code</label><div>${val(s.postal_code)}</div></div>
                    </div>

                    <div class="section-title">Academic information</div>
                    <div class="info-grid">
                        <div class="info-item"><label>Course</label><div>${val(s.course)}</div></div>
                        <div class="info-item"><label>Department</label><div>${val(s.department)}</div></div>
                        <div class="info-item"><label>Year</label><div>${val(s.year)}</div></div>
                        <div class="info-item"><label>Semester</label><div>${val(s.semester)}</div></div>
                    </div>

                    <div class="section-title">Admission information</div>
                    <div class="info-grid">
                        <div class="info-item"><label>Admission Date</label><div>${formatDate(s.admission_date)}</div></div>
                        <div class="info-item"><label>Record created</label><div>${formatDate(s.created_at)}</div></div>
                        <div class="info-item"><label>Last updated</label><div>${formatDate(s.updated_at)}</div></div>
                    </div>
                `;
            } catch (err) {
                document.getElementById("profileCard").innerHTML = `<div class="muted">Error: ${err.message}</div>`;
            }
        })();

        document.getElementById("deleteBtn").onclick = () => {
            document.getElementById("deleteModal").style.display = "flex";
        };
        document.getElementById("cancelDelete").onclick = () => {
            document.getElementById("deleteModal").style.display = "none";
        };
        document.getElementById("confirmDelete").onclick = async () => {
            try {
                await deleteStudent(id);
                location.href = "students.html";
            } catch (err) {
                alert(err.message);
            }
        };
    </script>
</body>

</html>
