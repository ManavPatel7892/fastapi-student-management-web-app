<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact · Aurora Suite</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top aurora-nav">
        <div class="container"><a class="navbar-brand" href="index.html"><span
                    class="brand-mark">A</span>Aurora<span>Suite</span></a><button class="navbar-toggler"
                data-bs-toggle="collapse" data-bs-target="#n">☰</button>
            <div class="collapse navbar-collapse" id="n">
                <ul class="navbar-nav ms-auto gap-lg-2">
                    <li><a class="nav-link" href="index.html">Home</a></li>
                    <li><a class="nav-link" href="about.html">About</a></li>
                    <li><a class="nav-link active" href="contact.html">Contact</a></li>
                    <li><a class="nav-link" href="courses.html">Courses</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container" style="padding-top:135px;padding-bottom:90px">
        <div class="row g-5">
            <div class="col-lg-5">
                <div class="eyebrow">SAY HELLO</div>
                <h1>Let’s talk about your <em>campus.</em></h1>
                <p class="lead mt-4">Have a question, partnership idea or implementation challenge? Send a note and our
                    team will get back to you.</p>
                <div class="mt-5">
                    <p><b>Email</b><br><span class="text-secondary">aurorasuite@education.com</span></p>
                    <p><b>Office</b><br><span class="text-secondary">18 North Learning Avenue<br>River District,
                            40021</span></p>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="feature-card">
                    <form
                        onsubmit="event.preventDefault();alert('Thanks! Your message has been received.');this.reset()">
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Your name</label><input
                                    class="form-control form-control-lg" required></div>
                            <div class="col-md-6"><label class="form-label">Email</label><input type="email"
                                    class="form-control form-control-lg" required></div>
                            <div class="col-12"><label class="form-label">Topic</label><select
                                    class="form-select form-select-lg">
                                    <option>General question</option>
                                    <option>Admissions</option>
                                    <option>Product support</option>
                                    <option>Partnership</option>
                                </select></div>
                            <div class="col-12"><label class="form-label">Message</label><textarea class="form-control"
                                    rows="6" required placeholder="Tell us what you need..."></textarea></div>
                            <div class="col-12"><button class="btn btn-primary btn-lg rounded-pill px-4">Send message <i
                                        class="bi bi-arrow-up-right ms-2"></i></button></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
