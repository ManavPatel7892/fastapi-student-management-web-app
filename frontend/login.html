<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in · Aurora Suite</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
    <main class="min-vh-100 d-flex align-items-center py-5"
        style="background:radial-gradient(circle at 80% 20%,#ddd5ff,transparent 35%),var(--cream)">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="text-center mb-4"><a class="navbar-brand" href="index.html"><span
                                class="brand-mark">A</span>Aurora<span>Suite</span></a></div>
                    <div class="feature-card p-4 p-md-5">
                        <div class="eyebrow">WELCOME BACK</div>
                        <h2>Sign in to your workspace.</h2>
                        <p class="text-secondary">Manage your campus from one clear view.</p>
                        <div id="alertBox" class="alert d-none mt-3" role="alert"></div>
                        <form id="loginForm">
                            <label class="form-label mt-3">Email</label>
                            <input type="email" id="email" class="form-control form-control-lg"
                                placeholder="you@example.com" required>
                            <label class="form-label mt-3">Password</label>
                            <input type="password" id="password" class="form-control form-control-lg"
                                placeholder="••••••••" required>
                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill mt-4" id="btnLogin">
                                Sign in
                            </button>
                        </form>
                        <p class="text-center mt-4 mb-0 text-secondary">
                            New here? <a href="register.html">Create an account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="assets/js/api.js"></script>
    <script>
        if (isLoggedIn()) location.href = "admin/index.html";

        const form = document.getElementById("loginForm");
        const alertBox = document.getElementById("alertBox");
        const btn = document.getElementById("btnLogin");

        function showAlert(msg, type = "danger") {
            alertBox.className = `alert alert-${type} mt-3`;
            alertBox.textContent = msg;
            alertBox.classList.remove("d-none");
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = "Signing in…";
            alertBox.classList.add("d-none");
            try {
                await loginUser(
                    document.getElementById("email").value.trim(),
                    document.getElementById("password").value
                );
                location.href = "admin/index.html";
            } catch (err) {
                showAlert(err.message || "Login failed");
                btn.disabled = false;
                btn.textContent = "Sign in";
            }
        });
    </script>
</body>

</html>
